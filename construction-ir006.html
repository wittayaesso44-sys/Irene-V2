<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IR006 | IRENE DESIGN</title>
<meta name="description" content="รายละเอียดผลงานก่อสร้าง IR006 โดย IRENE DESIGN">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0a0a0a;
    --paper:#ffffff;
    --line:#111111;
    --muted:#5a5a5a;
    --max: 1240px;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ scroll-behavior:smooth; }
  body{
    font-family:'Prompt','Poppins',sans-serif;
    color:var(--ink);
    background:var(--paper);
    -webkit-font-smoothing:antialiased;
    line-height:1.7;
  }
  img{ max-width:100%; display:block; }
  .wrap{ max-width:var(--max); margin:0 auto; padding:0 40px; }
  a{ color:inherit; text-decoration:none; }

  /* Header */
  header{ padding-top:30px; }
  .header-top{
    display:flex; align-items:center; justify-content:space-between;
    flex-wrap:wrap; gap:16px; padding-bottom:18px; border-bottom:1.5px solid var(--line);
  }
  .logo{
    font-family:'Poppins',sans-serif; font-weight:800;
    font-size:clamp(20px, 3vw, 26px); letter-spacing:1px; text-transform:uppercase;
  }
  nav{ display:flex; gap:30px; flex-wrap:wrap; }
  nav a{
    font-family:'Poppins',sans-serif; font-size:14px; letter-spacing:0.5px;
    text-transform:uppercase; font-weight:500; transition:opacity .2s ease;
  }
  nav a:hover{ opacity:.55; }

  /* Hero */
  .hero-img{ margin-top:36px; }
  .hero-img img{ width:100%; height:auto; max-height:620px; object-fit:cover; }

  /* Title + specs */
  .specs-section{ padding:40px 0 36px; text-align:center; }
  .project-title{
    font-family:'Poppins',sans-serif; font-weight:700; font-size:clamp(20px,2.4vw,26px);
    letter-spacing:1px; text-transform:uppercase; margin-bottom:6px;
  }
  .project-code{ font-size:14.5px; color:var(--muted); margin-bottom:26px; }
  .specs-table{
    display:inline-grid; grid-template-columns:auto auto; gap:6px 18px;
    font-size:15.5px; margin:0 auto;
  }
  .specs-table dt{ text-align:right; font-weight:600; }
  .specs-table dd{ text-align:left; }
  .rooms-row{
    margin-top:26px; padding-top:24px; border-top:1px solid #ddd;
    display:flex; justify-content:center; flex-wrap:wrap; gap:8px 26px;
    font-size:14.5px; color:var(--ink);
  }

  /* Floor plan */
  .plan-section{ padding:20px 0 56px; }
  .plan-wrap{ max-width:900px; margin:0 auto; }
  .plan-wrap img{ width:100%; }

  /* Gallery */
  .gallery-section{ padding-bottom:70px; }
  .gallery-row{ display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px; }
  .gallery-row img, .gallery-full img{ width:100%; height:100%; object-fit:cover; display:block; }
  .gallery-row figure{ aspect-ratio:4/3; overflow:hidden; }
  .gallery-full{ aspect-ratio:16/7; overflow:hidden; }

  .gallery-grid{
    display:grid; grid-template-columns:repeat(3, 1fr); gap:16px;
  }
  .gallery-grid figure{ aspect-ratio:4/3; overflow:hidden; }
  .gallery-grid img{ width:100%; height:100%; object-fit:cover; display:block; }
  @media (max-width: 780px){
    .gallery-grid{ grid-template-columns:repeat(2, 1fr); }
  }

  .prevnext-bar{
    max-width:1240px; margin:0 auto; padding:0 40px 36px;
    display:flex; justify-content:space-between; align-items:center;
    flex-wrap:wrap; gap:14px;
  }
  .prevnext-bar a{
    display:inline-block;
    background:#000; color:#fff;
    font-family:'Prompt',sans-serif; font-weight:500; font-size:14.5px;
    letter-spacing:.3px; padding:12px 26px; border-radius:999px;
    transition:background .2s ease, transform .2s ease;
  }
  .prevnext-bar a:hover{ background:#222; transform:translateY(-2px); }
  @media (max-width: 560px){
    .prevnext-bar{ padding:0 22px 30px; }
    .prevnext-bar a{ font-size:13.5px; padding:10px 20px; }
  }

  /* Footer */
  .socials-bar{
    display:flex; justify-content:center; gap:18px; padding:20px 0 30px;
  }
  .socials-bar img{ width:24px; height:24px; }
  footer{ background:#000; color:#fff; }
  .footer-inner{
    padding:22px 40px; max-width:var(--max); margin:0 auto;
    font-family:'Poppins',sans-serif; font-weight:600; letter-spacing:1.5px;
    font-size:13px; text-transform:uppercase;
  }

  @media (max-width: 780px){
    .wrap{ padding:0 22px; }
    nav{ gap:16px 22px; }
    .specs-table{ grid-template-columns:1fr; text-align:center; }
    .specs-table dt{ text-align:center; }
    .gallery-row{ grid-template-columns:1fr; }
  }
</style>
</head>
