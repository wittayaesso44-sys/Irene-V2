<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | IRENE DESIGN</title>
<meta name="description" content="ติดต่อ IRENE DESIGN บริษัทรับออกแบบและก่อสร้างบ้าน เชียงใหม่">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0a0a0a;
    --paper:#ffffff;
    --line:#111111;
    --max: 1240px;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html{ scroll-behavior:smooth; }

  body{
    font-family:'Prompt','Poppins',sans-serif;
    color:var(--ink);
    background:var(--paper);
    -webkit-font-smoothing:antialiased;
    line-height:1.7;
  }

  img{ max-width:100%; display:block; }

  .wrap{
    max-width:var(--max);
    margin:0 auto;
    padding:0 40px;
  }

  a{ color:inherit; text-decoration:none; }

  /* ---------- Header ---------- */
  header{
    padding-top:36px;
  }

  .header-top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:20px;
  }

  .logo{
    font-family:'Poppins',sans-serif;
    font-weight:800;
    font-size:clamp(28px, 4vw, 40px);
    letter-spacing:1px;
    text-transform:uppercase;
  }

  .socials{
    display:flex;
    align-items:center;
    gap:14px;
    margin-top:8px;
  }

  .socials img{
    width:26px;
    height:26px;
  }

  nav{
    margin-top:22px;
    padding-bottom:18px;
    border-bottom:1.5px solid var(--line);
    display:flex;
    gap:36px;
    flex-wrap:wrap;
  }

  nav a{
    font-family:'Poppins',sans-serif;
    font-size:15px;
    letter-spacing:0.5px;
    text-transform:uppercase;
    font-weight:500;
    transition:opacity .2s ease;
  }

  nav a:hover{ opacity:.55; }

  nav a.active{
    font-weight:700;
    border-bottom:2px solid var(--ink);
    padding-bottom:4px;
  }

  /* ---------- Hero image (full-bleed) ---------- */
  .contact-hero{
    width:100%;
    margin-top:44px;
  }

  .contact-hero img{
    width:100%;
    height:auto;
    object-fit:cover;
    max-height:560px;
  }

  /* ---------- Contact section ---------- */
  .contact-section{
    padding:64px 0 120px;
  }

  .page-title{
    text-align:center;
    font-family:'Poppins',sans-serif;
    font-weight:800;
    font-size:clamp(30px, 4vw, 42px);
    letter-spacing:1px;
    text-transform:uppercase;
    margin-bottom:52px;
  }

  .contact-list{
    max-width:480px;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    gap:26px;
  }

  .contact-row{
    display:flex;
    align-items:center;
    gap:22px;
  }

  .contact-row img{
    width:26px;
    height:26px;
    flex-shrink:0;
  }

  .contact-row span{
    font-size:16px;
    color:var(--ink);
  }

  /* ---------- Footer ---------- */
  footer{
    background:#000;
    color:#fff;
  }

  .footer-inner{
    padding:26px 40px;
    max-width:var(--max);
    margin:0 auto;
    font-family:'Poppins',sans-serif;
    font-weight:600;
    letter-spacing:1.5px;
    font-size:14px;
    text-transform:uppercase;
  }

  /* ---------- Responsive ---------- */
  @media (max-width: 1080px){
    .wrap{ padding:0 24px; }
    nav{ gap:20px 28px; }
  }

  @media (max-width: 560px){
    header{ padding-top:24px; }
    .contact-hero{ margin-top:32px; }
    .page-title{ margin-bottom:40px; }
    .socials img{ width:22px; height:22px; }
    .contact-list{ max-width:100%; padding:0 12px; }
    .contact-row span{ font-size:14.5px; }
  }
</style>
</head>
